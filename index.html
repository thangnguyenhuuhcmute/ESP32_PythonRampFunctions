<!DOCTYPE html>
<html>

<head>
<title>ESP32 Machine Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body { font-family: Arial; margin:30px; }

.status{
background:#f2f2f2;
padding:15px;
margin-bottom:20px;
border-radius:5px;
}

.row{
display:flex;
align-items:center;
gap:10px;
margin-bottom:12px;
}

.ctrl{
display:flex;
align-items:center;
}

.arrows{
display:flex;
flex-direction:column;
margin-right:4px;
}

.arrows button{
padding:0;
width:24px;
height:18px;
line-height:18px;
margin:0;
font-size:12px;
}

input{
width:90px;
padding:5px;
}

.small{
width:60px;
}

button{
padding:8px 12px;
margin:4px;
}

</style>

</head>

<body>

<h2>BAC 88 Machine Dashboard</h2>

<div class="status">
Position: <b id="pos">%CURPOS%</b> mm<br>
State: <b id="state">%STATE%</b>
</div>

<h3>Positions</h3>

<form action="/save" method="GET">
<!-- POS1 -->
<div class="row">

POS1

<div class="ctrl">
<div class="arrows">
<button type="button" onclick="adj('pos1',0.01)">&#9650;</button>
<button type="button" onclick="adj('pos1',-0.01)">&#9660;</button>
</div>

<input id="pos1" name="pos1" value="%POS1%">
</div>

Speed

<div class="ctrl">
<div class="arrows">
<button type="button" onclick="adj('spd1',10)">&#9650;</button>
<button type="button" onclick="adj('spd1',-10)">&#9660;</button>
</div>

<input id="spd1" value="75" class="small">
</div>

<button type="button" onclick="goTo('pos1','spd1')">GO</button>

</div>

<br>

<button type="submit">SAVE</button>

</form>

<h3>Machine Control</h3>

<button onclick="send('/home')">HOME</button>
<button onclick="send('/jog?dir=+')">JOG +</button>
<button onclick="send('/jog?dir=-')">JOG -</button>
<button onclick="send('/stop')">STOP</button>
<button onclick="send('/solenoid')">SOLENOID TEST</button>

<script>

function send(url){
fetch(url)
}

function goTo(posID, speedID){

let mm = document.getElementById(posID).value
let speed = document.getElementById(speedID).value

fetch("/go?mm=" + mm + "&speed=" + speed)

}

function adj(id,delta){

let el = document.getElementById(id)
let v = parseFloat(el.value) || 0

v += delta

if(Math.abs(delta) < 1)
v = v.toFixed(2)

el.value = v

}

function updateStatus(){

fetch("/status")
.then(r=>r.json())
.then(data=>{

document.getElementById("pos").innerText = data.pos_mm
document.getElementById("state").innerText = data.state

})

}

setInterval(updateStatus,1000)

</script>
